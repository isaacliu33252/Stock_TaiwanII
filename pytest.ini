[pytest]
testpaths = tests FinRL
markers =
    unit: 快速、可重現、不依賴外部服務或大型本機資料的測試
    integration: 跨模組、subprocess 或 end-to-end 行為測試
    network: 需要外部網路或第三方 API 的測試
    slow: 執行時間明顯較一般 unit tests 長的測試
    gpu: 需要 GPU 或較重 ML runtime 支援的測試
    requires_data: 需要本機 caches、databases、生成報表或 model artifacts 的測試
