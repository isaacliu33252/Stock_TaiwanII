name: CI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pandas numpy scipy scikit-learn \
            lightgbm xgboost \
            requests \
            duckdb \
            pytest pytest-timeout

      # torch 體積太大，CI 只裝 CPU 版
      - name: Install PyTorch (CPU only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pytorch-tabnet
        run: pip install pytorch-tabnet || true

      # 確保所有測試可以被 import（最基本的 smoke check）
      - name: Collect tests (import smoke check)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ --collect-only -q 2>&1 | tail -20

      # 執行不需要外部 API / DB 資料的單元測試
      # 跳過：需要真實 DB 資料、外部 API、fubon SDK、GPU 的測試
      - name: Run unit tests
        run: |
          pytest tests/ \
            --timeout=30 \
            --ignore=tests/test_env.py \
            --ignore=tests/test_fetch_gdelt_news_csv.py \
            --ignore=tests/test_fetch_ltn_news_jsonl.py \
            --ignore=tests/test_filter_ltn_market_news.py \
            --ignore=tests/test_group_a_plus_source_staleness.py \
            --ignore=tests/test_run_ncf_daily_pipeline.py \
            --ignore=tests/test_taifex_futures_data.py \
            --ignore=tests/test_build_finbert_sentiment_features.py \
            --ignore=tests/test_build_llm_sentiment_features.py \
            --ignore=tests/test_prepare_ltn_llm_sentiment_bundle.py \
            -x -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts/misc
